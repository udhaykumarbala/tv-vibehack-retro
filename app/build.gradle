plugins {
    id 'com.android.application' version '8.5.2'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

// Release signing material, or null when it is not configured (debug builds do not need it).
def releaseSigning = { ->
    def props = new Properties()
    def propsFile = file('keystore.properties')
    if (propsFile.exists()) propsFile.withInputStream { props.load(it) }
    def pick = { String key, String env -> System.getenv(env) ?: props.getProperty(key) }
    def store = pick('storeFile', 'RETRO_RELEASE_STORE_FILE')
    def pwFile = pick('storePasswordFile', 'RETRO_RELEASE_STORE_PASSWORD_FILE')
    def alias = pick('keyAlias', 'RETRO_RELEASE_KEY_ALIAS')
    if (!store || !pwFile || !alias) return null
    if (!file(store).isFile() || !file(pwFile).isFile()) return null
    def pw = file(pwFile).getText('UTF-8').trim()
    if (pw.isEmpty()) return null
    return [storeFile: file(store), password: pw, alias: alias]
}()

android {
    namespace 'io.github.udhaykumarbala.retro'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.udhaykumarbala.retro'
        minSdk 26
        // 28 keeps plain /sdcard access (legacy storage) for user ROMs in /sdcard/Roms/NES.
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
        ndk {
            // The target TV is 32-bit only; arm64 is kept for newer boxes.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // Debug builds use a local debug key (keystore/debug.keystore, gitignored, generated on first build) so
    // every debug rebuild can `pm install -r` over the last one.
    // Release builds are signed with a private key kept outside the repository. Its location comes from
    // app/keystore.properties (gitignored) or environment variables; the password is read from a file:
    //   storeFile=/path/to/retro-release.jks          (env RETRO_RELEASE_STORE_FILE)
    //   storePasswordFile=/path/to/password-file      (env RETRO_RELEASE_STORE_PASSWORD_FILE)
    //   keyAlias=retro-release                        (env RETRO_RELEASE_KEY_ALIAS)
    // The keystore is PKCS12, so the key password is the store password.
    signingConfigs {
        debug {
            storeFile file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigning != null) {
            release {
                storeFile releaseSigning.storeFile
                storePassword releaseSigning.password
                keyAlias releaseSigning.alias
                keyPassword releaseSigning.password
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (releaseSigning != null) signingConfig signingConfigs.release
        }
    }

    packaging {
        jniLibs {
            // Extract native libs to nativeLibraryDir so the libretro core can be dlopen()ed by full path.
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/catalogAssets"
        }
    }

    lint {
        // Sideloaded, never published to Google Play.
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Bundle ../catalog/nes.json (repo root) as assets/catalog/nes.json when it exists. ROMs are never bundled.
def copyCatalog = tasks.register('copyCatalog', Copy) {
    from(file('../catalog')) { include 'nes.json' }
    into("$buildDir/generated/catalogAssets/catalog")
}
preBuild.dependsOn copyCatalog

// Fail early with a clear message when the libretro core has not been fetched.
tasks.register('checkCores') {
    doLast {
        ['armeabi-v7a', 'arm64-v8a'].each { abi ->
            def so = file("src/main/jniLibs/$abi/libfceumm_libretro_android.so")
            if (!so.exists()) throw new GradleException("Missing $so. Run cores/fetch-cores.sh first.")
        }
    }
}
preBuild.dependsOn 'checkCores'

// Refuse to build an unsigned or debug signed release: the release key must be configured explicitly.
tasks.register('checkReleaseSigning') {
    def configured = releaseSigning != null
    doLast {
        if (!configured) throw new GradleException(
            "Release signing is not configured. Create app/keystore.properties (storeFile, storePasswordFile, " +
            "keyAlias) or set RETRO_RELEASE_STORE_FILE, RETRO_RELEASE_STORE_PASSWORD_FILE and " +
            "RETRO_RELEASE_KEY_ALIAS, each pointing at existing files outside the repository.")
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'checkReleaseSigning' }

dependencies {
    implementation 'com.github.Swordfish90:LibretroDroid:0.14.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
